apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ciberguate-staging
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: ciberguate
    path: ingress-host.yaml
images:
  - name: ciberguate-frontend
    newName: 631412642574.dkr.ecr.us-east-1.amazonaws.com/ciberguate-frontend
    newTag: bootstrap
  - name: ciberguate-backend
    newName: 631412642574.dkr.ecr.us-east-1.amazonaws.com/ciberguate-backend
    newTag: bootstrap
replicas:
  - name: frontend
    count: 2
  - name: backend
    count: 2
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: ciberguate-config
    behavior: replace
    literals:
      - BACKEND_URL=http://backend:8000
      - CORS_ORIGINS=https://staging.ciberguate.example.com
      - SEED_DATA=false
      - AUTOMATION_INTERVAL_MS=60000
      - OPENAI_MODEL=gpt-5-mini
      - OIDC_ISSUER=
      - OIDC_CLIENT_ID=
      - OIDC_REDIRECT_URI=https://staging.ciberguate.example.com/oauth/callback
labels:
  - pairs:
      environment: staging
