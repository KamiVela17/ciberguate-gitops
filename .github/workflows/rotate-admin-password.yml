name: Rotate administrator password

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente donde se rotará la contraseña
        required: true
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Rotate AWS secret and Kubernetes credential
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ADMIN_PASSWORD: ${{ secrets.ROTATE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          test "${#ADMIN_PASSWORD}" -ge 8
          SECRET_ID="ciberguate/$ENVIRONMENT/auth-admin"
          CURRENT="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)"
          UPDATED="$(jq -c --arg password "$ADMIN_PASSWORD" '.ADMIN_PASSWORD = $password' <<< "$CURRENT")"
          aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$UPDATED" >/dev/null
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
          NAMESPACE="ciberguate-$ENVIRONMENT"
          ENCODED="$(printf '%s' "$ADMIN_PASSWORD" | base64 -w0)"
          kubectl -n "$NAMESPACE" patch secret ciberguate-secrets --type merge -p "{\"data\":{\"ADMIN_PASSWORD\":\"$ENCODED\"}}"
          kubectl -n "$NAMESPACE" rollout restart deployment/backend
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=10m
